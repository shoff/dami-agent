<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dami</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#101418; --panel:#171d24; --ink:#d7dde4; --dim:#7a8694; --ok:#4cb782;
          --run:#d9a441; --fail:#e0604f; --accent:#5aa9e6; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif;
         display:grid; grid-template-columns: 1fr 1fr; grid-template-rows:auto 1fr;
         height:100vh; gap:10px; padding:10px; }
  header { grid-column:1/3; display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:18px; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  section { background:var(--panel); border-radius:8px; padding:12px; overflow:auto;
            display:flex; flex-direction:column; min-height:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
       margin-bottom:8px; }
  #chatlog { flex:1; overflow:auto; margin-bottom:8px; }
  .msg { margin:6px 0; white-space:pre-wrap; }
  .msg.you { color:var(--accent); }
  .msg .meta { color:var(--dim); font-size:11px; }
  #chatform { display:flex; gap:8px; }
  #chatinput { flex:1; background:#0d1116; color:var(--ink); border:1px solid #2a333d;
               border-radius:6px; padding:8px; font:inherit; }
  button { background:#233041; color:var(--ink); border:0; border-radius:6px;
           padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { background:#2d3d52; }
  #graph { font:12px/1.5 ui-monospace, monospace; }
  .ev { white-space:pre; }
  .ev .t { color:var(--dim); }
  .ev.Succeeded .s { color:var(--ok); }
  .ev.Running .s { color:var(--run); }
  .ev.Failed .s { color:var(--fail); }
  .trace-head { color:var(--accent); margin-top:8px; }
  .surf { border-bottom:1px solid #232c36; padding:6px 0; }
  .surf .title { font-weight:600; }
  .surf .conf { color:var(--dim); font-size:11px; }
  .surf .acts { margin-top:4px; display:flex; gap:6px; }
  .belief { padding:4px 0; border-bottom:1px solid #232c36; }
  .belief .conf { color:var(--dim); font-size:11px; }
  .quiet { color:var(--dim); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>Dami</h1>
  <span class="sub">rendered from the durable event stream — the display invents nothing</span>
  <span class="sub" id="status"></span>
</header>

<section>
  <h2>Conversation</h2>
  <div id="chatlog"></div>
  <form id="chatform">
    <input id="chatinput" placeholder="say something…" autocomplete="off">
    <button>send</button>
  </form>
</section>

<section>
  <h2>Live execution graph</h2>
  <div id="graph"></div>
</section>

<section>
  <h2>Surfacings <span class="sub">(reactions train the taste model)</span></h2>
  <div id="inbox"></div>
</section>

<section>
  <h2>Beliefs <span class="sub">(the active ledger)</span></h2>
  <div id="beliefs"></div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
let lastSeq = 0;
const spanDepth = new Map();   // spanId -> depth
const spanParent = new Map();  // spanId -> parentSpanId
const seenTraces = new Set();

function depthOf(spanId) {
  let d = 0, cur = spanParent.get(spanId);
  while (cur && d < 16 && spanParent.has(cur)) { d++; cur = spanParent.get(cur); }
  return spanParent.get(spanId) ? d + 1 : 0;
}

function renderEvent(ev) {
  spanParent.set(ev.spanId, ev.parentSpanId);
  const g = $("graph");
  if (!seenTraces.has(ev.traceId)) {
    seenTraces.add(ev.traceId);
    const head = document.createElement("div");
    head.className = "trace-head";
    head.textContent = `trace ${ev.traceId.replaceAll("-","").slice(0,8)} · ${ev.origin}`;
    g.appendChild(head);
  }
  const line = document.createElement("div");
  line.className = `ev ${ev.status}`;
  const t = new Date(ev.occurredAt).toLocaleTimeString();
  const indent = "  ".repeat(depthOf(ev.spanId));
  line.innerHTML = `<span class="t">${t}</span> <span class="s">${ev.status.padEnd(9)}</span> `
    + `${indent}<b>${ev.type}</b> <span class="t">${ev.actorId}</span> ${escapeHtml(ev.label)}`;
  g.appendChild(line);
  g.scrollTop = g.scrollHeight;
}

function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

async function pollEvents() {
  try {
    const r = await fetch(`/events?after=${lastSeq}`);
    const items = await r.json();
    for (const ev of items) { lastSeq = Math.max(lastSeq, ev.sequence); renderEvent(ev); }
    $("status").textContent = `live · seq ${lastSeq}`;
  } catch { $("status").textContent = "dami-host unreachable"; }
  setTimeout(pollEvents, 2000);
}

async function loadInbox() {
  const r = await fetch("/surfacings"); const items = await r.json();
  const box = $("inbox"); box.innerHTML = "";
  if (!items.length) { box.innerHTML = '<div class="quiet">nothing pending — the muse is quiet</div>'; return; }
  for (const s of items) {
    const id8 = s.surfacingId.replaceAll("-","").slice(0,8);
    const div = document.createElement("div");
    div.className = "surf";
    div.innerHTML = `<div class="title">${escapeHtml(s.title)}</div>`
      + `<div class="conf">${id8} · ${s.serviceName} · confidence ${s.confidence.toFixed(2)}</div>`
      + `<div>${escapeHtml(s.body)}</div>`
      + `<div class="acts"><button data-v="good">good</button>`
      + `<button data-v="meh">meh</button><button data-v="bad">bad</button></div>`;
    div.querySelectorAll("button").forEach(b => b.onclick = async () => {
      await fetch(`/surfacings/${id8}/feedback`, {method:"POST",
        headers:{"content-type":"application/json"},
        body: JSON.stringify({verdict: b.dataset.v, note: null})});
      loadInbox();
    });
    box.appendChild(div);
  }
}

async function loadBeliefs() {
  const r = await fetch("/beliefs"); const items = await r.json();
  const box = $("beliefs"); box.innerHTML = "";
  if (!items.length) { box.innerHTML = '<div class="quiet">the ledger holds no active conclusions</div>'; return; }
  for (const b of items) {
    const div = document.createElement("div");
    div.className = "belief";
    div.innerHTML = `<div>${escapeHtml(b.statement)}</div>`
      + `<div class="conf">${b.confidence.toFixed(2)} · ${b.source} · `
      + `${(b.supportingObservations||[]).length} obs</div>`;
    box.appendChild(div);
  }
}

$("chatform").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("chatinput").value.trim();
  if (!text) return;
  $("chatinput").value = "";
  addMsg("you", text);
  const reply = addMsg("dami", "");
  const r = await fetch("/turns/stream", {method:"POST",
    headers:{"content-type":"application/json"}, body: JSON.stringify({message:text})});
  const meta = `${r.headers.get("X-Dami-Route")} · ~${r.headers.get("X-Dami-Ctx-Tokens")} ctx tokens`
    + ` · trace ${(r.headers.get("X-Dami-Trace")||"").slice(0,8)}`;
  reply.querySelector(".meta").textContent = meta;
  const reader = r.body.getReader(); const dec = new TextDecoder();
  let buf = "", out = reply.querySelector(".body");
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const event = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const frag = event.split("\n").filter(l => l.startsWith("data: "))
        .map(l => l.slice(6)).join("\n");
      out.textContent += frag;
      $("chatlog").scrollTop = $("chatlog").scrollHeight;
    }
  }
};

function addMsg(who, text) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  div.innerHTML = `<div class="meta">${who}</div><div class="body">${escapeHtml(text)}</div>`;
  $("chatlog").appendChild(div);
  $("chatlog").scrollTop = $("chatlog").scrollHeight;
  return div;
}

pollEvents();
loadInbox(); setInterval(loadInbox, 15000);
loadBeliefs(); setInterval(loadBeliefs, 60000);
</script>
</body>
</html>
