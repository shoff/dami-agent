filebeat.inputs:
  - type: journald
    id: dami-host
    chroot: /hostfs
    include_matches.match:
      - _SYSTEMD_UNIT=dami-host.service
    seek: tail

  - type: journald
    id: dami-proactive
    chroot: /hostfs
    include_matches.match:
      - _SYSTEMD_UNIT=dami-proactive.service
    seek: tail

processors:
  - decode_json_fields:
      add_error_key: true
      fields: ["message"]
      target: dami

  - add_fields:
      target: service
      fields:
        name: dami

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "dami-runtime-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: true
setup.template.name: dami-runtime
setup.template.pattern: dami-runtime-*
